# ═══════════════════════════════════════════════════════════════════════════
# nginx.conf — Serve the React SPA and support client-side routing
# ═══════════════════════════════════════════════════════════════════════════
# WHY try_files?
#   React Router uses paths like /browse and /tools/3.
#   Those are NOT real files on disk. Nginx must return index.html
#   so React can take over routing in the browser.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip common text assets (smaller downloads)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
